[project]
name = "quant-db"
version = "0.1.0"
description = "Local quantitative research database"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb",
    "dbt-core",
    "dbt-duckdb",
    "pyarrow",
    "pandas",
    "requests",
    "tushare",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quant_db", "src/quant_ingest"]
